version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=urja-sync-docker-secret-change-me
      - DB_PATH=./data/urja-sync.db
      - CLIENT_URL=http://localhost:5173
      - AI_SERVICE_ENABLED=false
    volumes:
      - server-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  server-data:
